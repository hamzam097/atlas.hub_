<!DOCTYPE html>
<html>
<head>
<title>ATLAS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:20px;
  color:red;
  font-weight:bold;
}

/* HERO VIDEO */
.hero{
  position:relative;
  height:90vh;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-content{
  position:relative;
  z-index:2;
  text-align:center;
  top:40%;
  transform:translateY(-50%);
}

.hero h1{
  font-size:60px;
  animation:fade 2s;
}

.hero p{
  color:#ccc;
  animation:fade 3s;
}

@keyframes fade{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:#111;
  padding:20px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px red;
}

.card img{
  width:100%;
}

.card p{
  color:red;
  font-weight:bold;
}

button{
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
}

/* CART */
.cart{
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:#111;
  padding:20px;
  transform:translateX(100%);
  transition:0.3s;
}

.cart.active{
  transform:translateX(0);
}

.cart h2{
  color:red;
}

</style>
</head>

<body>

<header>
  ATLAS HUB
  <button onclick="toggleCart()">🛒</button>
</header>

<!-- HERO VIDEO -->
<section class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-man-training-hard-5176/1080p.mp4">
  </video>

  <div class="hero-content">
    <h1>FUEL YOUR STRENGTH 💪</h1>
    <p>Performance • Power • Style</p>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products">

<div class="card">
  <img src="creatine 1.png">
  <h3>Optimum Nutrition</h3>
  <p>400 DH</p>
  <button onclick="addCart('Optimum Nutrition',400)">Add to cart</button>
</div>

<div class="card">
  <img src="spider.png">
  <h3>Spider Pro</h3>
  <p>159 DH</p>
  <button onclick="addCart('Spider Pro',159)">Add to cart</button>
</div>

</section>

<!-- CART -->
<div class="cart" id="cart">
  <h2>Cart</h2>
  <div id="cart-items"></div>
  <h3 id="total">Total: 0 DH</h3>
  <button onclick="checkout()">Checkout</button>
</div>

<script>

let cart = [];

function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function addCart(name,price){
  cart.push({name,price});
  renderCart();
}

function renderCart(){
  let items = document.getElementById("cart-items");
  items.innerHTML = "";
  let total = 0;

  cart.forEach(item=>{
    items.innerHTML += "<p>"+item.name+" - "+item.price+" DH</p>";
    total += item.price;
  });

  document.getElementById("total").innerText = "Total: "+total+" DH";
}

function checkout(){
  let text = "Commande:\n";
  cart.forEach(i=>{
    text += i.name + " - " + i.price + " DH\n";
  });

  window.open("https://www.instagram.com/atlas.hub_/?text=" + encodeURIComponent(text));
}

</script>

</body>
</html>

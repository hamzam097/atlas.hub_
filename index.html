<!DOCTYPE html>
<html>
<head>
  <title>ATLAS HUB</title>
  <style>
    body {
      margin:0;
      font-family: Arial;
      background:black;
      color:white;
    }

    header {
      display:flex;
      justify-content:space-between;
      padding:20px;
      background:#0a0a0a;
    }

    .logo {
      color:red;
      font-size:24px;
      font-weight:bold;
    }

    .hero {
      text-align:center;
      padding:100px;
      background:linear-gradient(black,#111);
    }

    .hero h1 {
      color:red;
      font-size:50px;
    }

    .products {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card {
      background:#111;
      padding:20px;
      border-radius:10px;
      text-align:center;
    }

    button {
      background:red;
      color:white;
      border:none;
      padding:10px 20px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ATLAS HUB</div>
</header>

<section class="hero">
  <h1>FUEL YOUR STRENGTH 💪</h1>
  <p>Gym Wear - Supplements - Accessories</p>
</section>

<section class="products">

  <div class="card">
    <h2>Spider Pro</h2>
    <p>160 DH</p>
    <button>Order</button>
  </div>

  <div class="card">
    <h2>Iron Start</h2>
    <p>160 DH</p>
    <button>Order</button>
  </div>

</section>

</body>
</html>

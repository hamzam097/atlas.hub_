<!DOCTYPE html>
<html>
<head>
<title>Cyber News</title>
<style>
body{
    background:black;
    color:white;
    font-family:Arial;
    padding:20px;
}

.news{
    background:#111;
    margin:15px 0;
    padding:15px;
    border-radius:10px;
}

a{
    color:red;
    text-decoration:none;
}
</style>
</head>

<body>

<h1>🔥 Cyber Security News</h1>

<div id="news"></div>

<script>
fetch("https://api.rss2json.com/v1/api.json?rss_url=https://feeds.feedburner.com/TheHackersNews")
.then(res => res.json())
.then(data => {
    let container = document.getElementById("news");

    data.items.forEach(item => {
        container.innerHTML += `
        <div class="news">
            <h3>${item.title}</h3>
            <p>${item.pubDate}</p>
            <a href="${item.link}" target="_blank">Read more</a>
        </div>
        `;
    });
});
</script>

</body>
</html>

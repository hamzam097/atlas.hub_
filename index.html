<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber AI News</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
margin:0;
}

/* HERO */
.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px;
}

.hero img{
width:250px;
border-radius:10px;
box-shadow:0 0 25px red;
}

/* NEWS */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#111;
padding:20px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 20px red;
transform:scale(1.03);
}

button{
background:none;
border:none;
color:red;
cursor:pointer;
}

/* 🔥 MODAL PRO */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.modal-content{
background:#111;
padding:30px;
border-radius:15px;
max-width:600px;
width:90%;
animation:zoom 0.3s ease;
}

@keyframes zoom{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.close{
float:right;
cursor:pointer;
font-size:20px;
}

</style>
</head>

<body>

<div class="hero">
<img src="CPR 2.png">
<h1>🔥 Cyber AI News</h1>
</div>

<div id="news" class="container"></div>

<!-- 🔥 MODAL -->
<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h2 id="title"></h2>
<p id="desc"></p>
</div>
</div>

<script>

/* 🔥 DEMO + REAL FALLBACK */
const demo = [
{
title:"Critical vulnerability found in Linux systems",
desc:"This vulnerability allows attackers to gain root access and compromise servers..."
},
{
title:"New malware targeting Android users",
desc:"A dangerous malware spreading through fake apps targeting Android users worldwide..."
},
{
title:"AI used in cyber attacks increasing rapidly",
desc:"Hackers now using AI tools to automate phishing and cyber attacks..."
}
];

/* حاول يجيب API */
fetch("https://api.rss2json.com/v1/api.json?rss_url=https://feeds.feedburner.com/TheHackersNews")
.then(res=>res.json())
.then(data=>{
if(data.items){
display(data.items);
}else{
display(demo);
}
})
.catch(()=>{
display(demo);
});

/* عرض الأخبار */
function display(list){
let c=document.getElementById("news");
c.innerHTML="";

list.slice(0,6).forEach(n=>{
c.innerHTML+=`
<div class="card">
<h3>${n.title}</h3>
<button onclick="openModal('${n.title}', \`${n.description || n.desc}\`)">
Read more →
</button>
</div>
`;
});
}

/* 🔥 MODAL */
function openModal(t,d){
document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=t;
document.getElementById("desc").innerHTML=d;
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>

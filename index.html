<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* HEADER */
header{
  padding:20px;
  background:black;
}

.logo{
  color:red;
  font-size:24px;
  font-weight:bold;
}

/* HERO BACKGROUND */
.hero{
  height:90vh;
  background: url("https://images.unsplash.com/photo-1540497077202-7c8a3999166f") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DARK OVERLAY */
.overlay{
  background:rgba(0,0,0,0.6);
  padding:40px;
  border-radius:10px;
  text-align:center;
}

/* TEXT */
.hero h1{
  font-size:50px;
}

.hero p{
  color:#ccc;
  margin-top:10px;
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  background:red;
  border:none;
  color:white;
  cursor:pointer;
}

/* PRODUCTS */
.products{
  padding:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:30px;
}

.card{
  background:#111;
  border-radius:10px;
  overflow:hidden;
}

.card img{
  width:100%;
}

.card-content{
  padding:15px;
  text-align:center;
}

.price{
  color:red;
  font-size:22px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.buy{
  flex:1;
  background:red;
  border:none;
  color:white;
  padding:10px;
}

.instagram{
  flex:1;
  background:#E1306C;
  border:none;
  color:white;
  padding:10px;
}

/* RESPONSIVE */
@media(min-width:768px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:768px){
  .hero h1{
    font-size:28px;
  }

  .overlay{
    padding:20px;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ATLAS HUB</div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="overlay">
    <h1>FUEL YOUR STRENGTH</h1>
    <p>Performance • Power • Style</p>
    <button class="btn">Shop Now</button>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products">
<div class="grid">

<div class="card">
  <img src="spider.png">
  <div class="card-content">
    <h2>Spider Pro</h2>
    <p class="price">159 DH</p>
    <div class="buttons">
      <button class="buy">Buy</button>
      <a href="https://instagram.com/atlas.hub_" target="_blank">
        <button class="instagram">Instagram</button>
      </a>
    </div>
  </div>
</div>

<div class="card">
  <img src="BRODUCT.png">
  <div class="card-content">
    <h2>Iron Start</h2>
    <p class="price">159 DH</p>
    <div class="buttons">
      <button class="buy">Buy</button>
      <a href="https://instagram.com/atlas.hub_" target="_blank">
        <button class="instagram">Instagram</button>
      </a>
    </div>
  </div>
</div>

</div>
</section>

</body>
</html>

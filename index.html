<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* HEADER */
header{
  padding:20px;
  background:black;
  display:flex;
  justify-content:space-between;
}

.logo{
  color:red;
  font-weight:bold;
}

.cart{
  cursor:pointer;
}

/* VIDEO HERO */
.hero{
  position:relative;
  height:90vh;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:relative;
  z-index:2;
  text-align:center;
  top:50%;
  transform:translateY(-50%);
}

/* ANIMATION */
.hero h1{
  font-size:50px;
  animation:fade 2s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.btn{
  margin-top:20px;
  padding:12px 25px;
  background:red;
  border:none;
  color:white;
}

/* PRODUCTS */
.products{
  padding:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:30px;
}

.card{
  background:#111;
  border-radius:10px;
  overflow:hidden;
}

.card img{
  width:100%;
}

.card-content{
  padding:15px;
  text-align:center;
}

button{
  background:red;
  border:none;
  color:white;
  padding:10px;
  width:100%;
  margin-top:10px;
  cursor:pointer;
}

/* CART PANEL */
.cart-box{
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:#111;
  padding:20px;
  display:none;
}

/* CHECKOUT */
.checkout{
  padding:20px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

/* RESPONSIVE */
@media(min-width:768px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ATLAS HUB</div>
  <div class="cart" onclick="toggleCart()">🛒 (<span id="count">0</span>)</div>
</header>

<!-- HERO VIDEO -->
<section class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-working-out-with-ropes-1574/1080p.mp4">
  </video>

  <div class="overlay">
    <h1>FUEL YOUR STRENGTH</h1>
    <p>Performance • Power • Style</p>
    <button class="btn">Shop Now</button>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products">
<div class="grid">

<div class="card">
  <img src="spider.png">
  <div class="card-content">
    <h2>Spider Pro</h2>
    <p>159 DH</p>
    <button onclick="addCart('Spider Pro')">Add to cart</button>
  </div>
</div>

<div class="card">
  <img src="BRODUCT.png">
  <div class="card-content">
    <h2>Iron Start</h2>
    <p>159 DH</p>
    <button onclick="addCart('Iron Start')">Add to cart</button>
  </div>
</div>

</div>
</section>

<!-- CART -->
<div class="cart-box" id="cartBox">
  <h3>Cart</h3>
  <ul id="items"></ul>
  <button onclick="showCheckout()">Checkout</button>
</div>

<!-- CHECKOUT -->
<section class="checkout" id="checkout" style="display:none;">
  <h2>Checkout</h2>
  <input placeholder="Nom">
  <input placeholder="Téléphone">
  <input placeholder="Ville">
  <button>Commander</button>
</section>

<script>
let cart = [];

function addCart(item){
  cart.push(item);
  document.getElementById("count").innerText = cart.length;

  let li = document.createElement("li");
  li.innerText = item;
  document.getElementById("items").appendChild(li);
}

function toggleCart(){
  let box = document.getElementById("cartBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function showCheckout(){
  document.getElementById("checkout").style.display = "block";
}
</script>

</body>
</html>

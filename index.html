<!DOCTYPE html>
<html>
<head>
  <title>ATLAS HUB</title>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:black;
      color:white;
    }

    header {
      padding:20px;
      font-size:24px;
      color:red;
      font-weight:bold;
    }

    .hero {
      height:70vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      background:
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
      url("https://images.unsplash.com/photo-1599058917765-a780eda07a3e");

      background-size:cover;
      background-position:center;
    }

    .hero h1 {
      font-size:50px;
    }

    .hero p {
      color:#aaa;
    }

    .products {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card {
      background:#111;
      padding:20px;
      border-radius:15px;
      text-align:center;
      transition:0.3s;
      border:1px solid #222;
    }

    .card:hover {
      transform:scale(1.05);
      box-shadow:0 0 20px red;
    }

    .card img {
      width:100%;
      border-radius:10px;
    }

    .card h2 {
      margin:10px 0;
    }

    .card p {
      color:red;
      font-size:20px;
      font-weight:bold;
    }

    button {
      background:red;
      color:white;
      border:none;
      padding:10px 20px;
      margin-top:10px;
      cursor:pointer;
      border-radius:5px;
      font-weight:bold;
    }

    button:hover {
      background:#ff2a2a;
    }

    .section-title {
      padding-left:40px;
      font-size:22px;
      margin-top:20px;
      color:red;
    }

  </style>
</head>

<body>

<header>ATLAS HUB</header>

<section class="hero">
  <h1>FUEL YOUR STRENGTH 💪</h1>
  <p>Gym Wear - Supplements - Accessories</p>
</section>

<!-- ===== CREATINE ===== -->
<h2 class="section-title">SUPPLEMENTS</h2>

<section class="products">

  <div class="card">
    <img src="creatine 1.png">
    <h2>Optimum Nutrition Creatine</h2>
    <p>400 DH</p>
    <button onclick="order('Optimum Nutrition Creatine')">Commander</button>
  </div>

  <div class="card">
    <img src="creatine 2.png">
    <h2>BioTechUSA Creatine</h2>
    <p>400 DH</p>
    <button onclick="order('BioTechUSA Creatine')">Commander</button>
  </div>

  <div class="card">
    <img src="creatine 3.png">
    <h2>MyMuscle Creatine</h2>
    <p>400 DH</p>
    <button onclick="order('MyMuscle Creatine')">Commander</button>
  </div>

  <div class="card">
    <img src="creatine 4.png">
    <h2>HX Nutrition Creatine</h2>
    <p>200 DH</p>
    <button onclick="order('HX Nutrition Creatine')">Commander</button>
  </div>

</section>

<!-- ===== T-SHIRTS ===== -->
<h2 class="section-title">GYM WEAR</h2>

<section class="products">

  <div class="card">
    <img src="spider.png">
    <h2>Spider Pro T-Shirt</h2>
    <p>159 DH</p>
    <button onclick="order('Spider Pro T-Shirt')">Commander</button>
  </div>

  <div class="card">
    <img src="BRODUCT.png">
    <h2>Iron Start T-Shirt</h2>
    <p>159 DH</p>
    <button onclick="order('Iron Start T-Shirt')">Commander</button>
  </div>

</section>

<script>
function order(product){
  let msg = "سلام، بغيت نكوموندي: " + product;
  window.open("https://www.instagram.com/atlas.hub_/?text=" + encodeURIComponent(msg));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS HUB</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0a0a0a;
  color:white;
}

/* HEADER */
header {
  padding:20px;
  background:black;
}

.logo {
  color:red;
  font-size:24px;
  font-weight:bold;
}

/* PRODUCTS */
.products {
  padding:30px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:40px;
}

/* CARD */
.card {
  background:#111;
  border-radius:15px;
  overflow:hidden;
}

/* IMAGE */
.card img {
  width:100%;
  height:auto;
  display:block;
}

/* CONTENT */
.card-content {
  padding:20px;
  text-align:center;
}

.price {
  color:red;
  font-size:22px;
  margin:10px 0;
}

/* BUTTONS */
.buttons {
  display:flex;
  gap:10px;
}

.buy {
  flex:1;
  background:red;
  border:none;
  color:white;
  padding:12px;
  cursor:pointer;
}

.instagram {
  flex:1;
  background:#E1306C;
  border:none;
  color:white;
  padding:12px;
  cursor:pointer;
}
</style>

</head>

<body>

<header>
  <div class="logo">ATLAS HUB</div>
</header>

<section class="products">

<div class="grid">

<!-- SPIDER -->
<div class="card">
  <img src="spider.png">
  <div class="card-content">
    <h2>Spider Pro</h2>
    <p class="price">159 DH</p>
    <div class="buttons">
      <button class="buy">Buy</button>
      <a href="https://instagram.com/atlas.hub_" target="_blank">
        <button class="instagram">Instagram</button>
      </a>
    </div>
  </div>
</div>

<!-- IRON -->
<div class="card">
  <img src="BRODUCT.png">
  <div class="card-content">
    <h2>Iron Start</h2>
    <p class="price">159 DH</p>
    <div class="buttons">
      <button class="buy">Buy</button>
      <a href="https://instagram.com/atlas.hub_" target="_blank">
        <button class="instagram">Instagram</button>
      </a>
    </div>
  </div>
</div>

</div>

</section>

</body>
</html>

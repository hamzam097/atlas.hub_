<!DOCTYPE html>
<html>
<head>
<title>ATLAS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

header{
  padding:20px;
  color:red;
  font-weight:bold;
}

.hero{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
  url("https://images.unsplash.com/photo-1540497077202-7c8a3999166f");
  background-size:cover;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:#111;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.card img{
  width:100%;
  border-radius:10px;
}

.card p{
  color:red;
}

button{
  background:red;
  border:none;
  padding:10px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>ATLAS HUB</header>

<section class="hero">
  <h1>FUEL YOUR STRENGTH 💪</h1>
</section>

<section class="products">

<div class="card">
  <a href="product1.html">
    <img src="creatine 1.png">
  </a>
  <h3>Creatine Basic</h3>
  <p>400 DH</p>
</div>

<div class="card">
  <a href="product2.html">
    <img src="creatine 2.png">
  </a>
  <h3>Creatine Pro</h3>
  <p>400 DH</p>
</div>

<div class="card">
  <a href="product3.html">
    <img src="creatine 3.png">
  </a>
  <h3>Creatine Max</h3>
  <p>400 DH</p>
</div>

<div class="card">
  <a href="product4.html">
    <img src="creatine 4.png">
  </a>
  <h3>Creatine Pure</h3>
  <p>200 DH</p>
</div>

</section>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber AI News</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

.hero{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.hero img{
width:250px;
border-radius:10px;
box-shadow:0 0 20px red;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
padding:15px;
border-radius:10px;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 15px red;
}

button{
background:none;
border:none;
color:red;
cursor:pointer;
}

</style>
</head>

<body>

<div class="hero">
<img src="CPR 2.png">
<h1>🔥 Cyber AI News</h1>
</div>

<div id="news" class="container"></div>

<script>

/* 🔥 DEMO DATA (باش يبان الموقع خدام) */
const demoNews = [
{
title:"Critical vulnerability found in Linux systems",
date:"2026",
desc:"This vulnerability allows attackers to gain root access..."
},
{
title:"New malware targeting Android users",
date:"2026",
desc:"A dangerous malware spreading through fake apps..."
},
{
title:"AI used in cyber attacks increasing rapidly",
date:"2026",
desc:"Hackers now using AI to automate attacks..."
}
];

function display(news){
let c = document.getElementById("news");
c.innerHTML="";

news.forEach(n=>{
c.innerHTML += `
<div class="card">
<h3>${n.title}</h3>
<p>${n.date}</p>
<button onclick="openModal('${n.title}','${n.desc}')">Read more →</button>
</div>
`;
});
}

display(demoNews);

/* 🔥 MODAL SIMPLE */
function openModal(t,d){
alert(t + "\n\n" + d);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS HUB</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:black;
    color:white;
}

/* HERO */
.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:50px;
}

.btn{
    background:red;
    padding:12px 25px;
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-top:20px;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:#111;
    padding:15px;
    text-align:center;
    border-radius:15px;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px red;
}

.card img{
    width:100%;
    border-radius:10px;
}

.price{
    color:red;
    font-weight:bold;
    margin:10px 0;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <h1>FUEL YOUR STRENGTH 💪</h1>
    <p>Performance • Power • Style</p>
</section>

<!-- 🔥 T-SHIRTS -->
<h2 style="padding-left:40px;">T-Shirts</h2>

<section class="products">

<div class="card">
<img src="spider.png">
<h3>Spider Pro</h3>
<p class="price">159 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

<div class="card">
<img src="PRODUCT.png">
<h3>Iron Start</h3>
<p class="price">159 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

</section>

<!-- 🔥 CREATINE -->
<h2 style="padding-left:40px;">Creatine</h2>

<section class="products">

<div class="card">
<img src="creatine 1.png">
<h3>Creatine Basic</h3>
<p class="price">400 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

<div class="card">
<img src="creatine 2.png">
<h3>Creatine Pro</h3>
<p class="price">400 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

<div class="card">
<img src="creatine 3.png">
<h3>Creatine Max</h3>
<p class="price">400 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

<div class="card">
<img src="creatine 4.png">
<h3>Creatine Pure</h3>
<p class="price">200 DH</p>
<a class="btn" href="https://ig.me/m/atlas.hub_">Commander</a>
</div>

</section>

</body>
</html>

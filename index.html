<!DOCTYPE html>
<html>
<head>
<title>ATLAS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  padding:20px;
  color:red;
  font-weight:bold;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  background:
  linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
  url("https://images.unsplash.com/photo-1540497077202-7c8a3999166f");

  background-size:cover;
  background-position:center;
}

.hero h1{
  font-size:50px;
  animation:fade 2s;
}

.hero p{
  color:#ccc;
  animation:fade 3s;
}

@keyframes fade{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:#111;
  padding:20px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
  border:1px solid #222;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px red;
}

.card img{
  width:100%;
  border-radius:10px;
}

.card p{
  color:red;
  font-weight:bold;
}

/* BUTTON */
button{
  background:red;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
  border-radius:5px;
  font-weight:bold;
}

button:hover{
  background:#ff2a2a;
}

/* CART */
.cart{
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100%;
  background:#111;
  padding:20px;
  transform:translateX(100%);
  transition:0.3s;
}

.cart.active{
  transform:translateX(0);
}

.cart h2{
  color:red;
}

.section-title{
  padding-left:40px;
  color:red;
}
</style>
</head>

<body>

<header>
  ATLAS HUB
  <button onclick="toggleCart()">🛒</button>
</header>

<!-- HERO -->
<section class="hero">
  <h1>FUEL YOUR STRENGTH 💪</h1>
  <p>Performance • Power • Style</p>
</section>

<!-- ===== CREATINE ===== -->
<h2 class="section-title">SUPPLEMENTS</h2>

<section class="products">

<div class="card">
  <img src="creatine 1.png">
  <h3>Creatine Basic</h3>
  <p>400 DH</p>
  <button onclick="addCart('Creatine Basic',400)">Add to cart</button>
</div>

<div class="card">
  <img src="creatine 2.png">
  <h3>Creatine Pro</h3>
  <p>400 DH</p>
  <button onclick="addCart('Creatine Pro',400)">Add to cart</button>
</div>

<div class="card">
  <img src="creatine 3.png">
  <h3>Creatine Max</h3>
  <p>400 DH</p>
  <button onclick="addCart('Creatine Max',400)">Add to cart</button>
</div>

<div class="card">
  <img src="creatine 4.png">
  <h3>Creatine Pure</h3>
  <p>200 DH</p>
  <button onclick="addCart('Creatine Pure',200)">Add to cart</button>
</div>

</section>

<!-- ===== TSHIRTS ===== -->
<h2 class="section-title">GYM WEAR</h2>

<section class="products">

<div class="card">
  <img src="spider.png">
  <h3>Spider Pro</h3>
  <p>159 DH</p>
  <button onclick="addCart('Spider Pro',159)">Add to cart</button>
</div>

<div class="card">
  <img src="BRODUCT.png">
  <h3>Iron Start</h3>
  <p>159 DH</p>
  <button onclick="addCart('Iron Start',159)">Add to cart</button>
</div>

</section>

<!-- CART -->
<div class="cart" id="cart">
  <h2>Cart</h2>
  <div id="cart-items"></div>
  <h3 id="total">Total: 0 DH</h3>
  <button onclick="checkout()">Checkout</button>
</div>

<script>

let cart = [];

function toggleCart(){
  document.getElementById("cart").classList.toggle("active");
}

function addCart(name,price){
  cart.push({name,price});
  renderCart();
}

function renderCart(){
  let items = document.getElementById("cart-items");
  items.innerHTML = "";
  let total = 0;

  cart.forEach(item=>{
    items.innerHTML += "<p>"+item.name+" - "+item.price+" DH</p>";
    total += item.price;
  });

  document.getElementById("total").innerText = "Total: "+total+" DH";
}

function checkout(){
  let text = "Commande:%0A";
  cart.forEach(i=>{
    text += i.name + " - " + i.price + " DH%0A";
  });

  window.open("https://www.instagram.com/atlas.hub_/");
}

</script>

</body>
</html>
